<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design | PicturesJully</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <!-- Open Graph -->
    <meta property="og:title" content="Design | Juu Freitas">
    <meta property="og:description" content="Portfólio de design — branding, identidade visual, social media e criação.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://picturesjully.netlify.app/designs.html">
    <meta property="og:image" content="https://picturesjully.netlify.app/assets/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Design | Juu Freitas">
    <meta name="twitter:description" content="Portfólio de design — branding, identidade visual, social media e criação.">
    <meta name="twitter:image" content="https://picturesjully.netlify.app/assets/og.png">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="apple-touch-icon" href="assets/apple-icon.png">
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">@pictures.jully</a>
            <nav class="nav-menu">
                <a href="index.html">Home</a>
                <a href="projects.html" class="active">Projetos</a>
                <a href="index.html#contato">Contato</a>
            </nav>
            <div class="nav-toggle">
                <div class="burger"></div>
            </div>
        </div>
    </header>

    <div class="mobile-overlay">
        <nav class="mobile-nav">
            <a href="index.html">Home</a>
            <a href="projects.html" class="active">Projetos</a>
            <a href="index.html#contato">Contato</a>
        </nav>
    </div>

    <main id="content-wrap">
        <section class="portfolio" style="padding-top: 150px;">
            <div class="container">
                <a href="projects.html" class="label" style="display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem; cursor: pointer;">
                    ← Voltar para Projetos
                </a>
                <h1 style="font-size: var(--font-xl); font-weight: 800; text-transform: uppercase; line-height: 0.9;">TRABALHOS DE <br><span class="text-blue">DESIGN.</span></h1>

                <!-- Grid dinâmico carregado via JS (Design Collection) -->
                <div id="design-grid" class="gallery-grid"></div>
            </div>
        </section>

        <!-- Modal / Lightbox (Compartilhado) -->
        <div id="photo-modal" class="modal">
            <div class="modal__content">
                <button class="modal__close" aria-label="Fechar">&times;</button>
                <button class="modal__nav modal__nav--prev" aria-label="Anterior">‹</button>
                <button class="modal__nav modal__nav--next" aria-label="Próximo">›</button>
                <img src="" alt="" class="modal__img">
                <div class="modal__counter" aria-live="polite"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Julia Freitas — All rights reserved.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
